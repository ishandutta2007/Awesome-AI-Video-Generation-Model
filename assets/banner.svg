<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="40%" stop-color="#0f1123" />
      <stop offset="80%" stop-color="#14112c" />
      <stop offset="100%" stop-color="#0a0614" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45" result="blur" />
    </filter>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>

    <style>
      .film-reel {
        animation: spin 24s linear infinite;
        transform-origin: 1040px 110px;
      }
      .orb-1 {
        animation: floatOrb 10s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .beam-sweep {
        animation: sweep 8s ease-in-out infinite alternate;
      }
      .particle-1 { animation: pulse 3s ease-in-out infinite; }
      .particle-2 { animation: pulse 4s ease-in-out 1s infinite; }
      .particle-3 { animation: pulse 3.5s ease-in-out 2s infinite; }
      .wave-line {
        stroke-dasharray: 8 6;
        animation: dash 30s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatOrb {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(50px, 30px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(-40px, -25px) scale(1.1); }
      }
      @keyframes sweep {
        0% { opacity: 0.2; transform: rotate(-5deg); }
        100% { opacity: 0.6; transform: rotate(8deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; transform: scale(1.3); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
    </style>
  </defs>

  <!-- Deep Sci-Fi Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Animated Background Glow Orbs (Behind everything) -->
  <g class="orb-1">
    <circle cx="180" cy="80" r="140" fill="#06b6d4" opacity="0.18" filter="url(#glowCyan)" />
  </g>
  <g class="orb-2">
    <circle cx="1020" cy="120" r="170" fill="#a855f7" opacity="0.22" filter="url(#glowPurple)" />
  </g>
  <circle cx="580" cy="380" r="160" fill="#ec4899" opacity="0.15" filter="url(#glowPink)" />

  <!-- Dynamic Camera / Film Aperture Motif (Upper Right Background) -->
  <g class="film-reel" opacity="0.25">
    <circle cx="1040" cy="110" r="90" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="14 8" />
    <circle cx="1040" cy="110" r="65" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="1040" cy="110" r="40" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="8 6" />
    <line x1="950" y1="110" x2="1130" y2="110" stroke="#818cf8" stroke-width="1" />
    <line x1="1040" y1="20" x2="1040" y2="200" stroke="#818cf8" stroke-width="1" />
    <line x1="976" y1="46" x2="1104" y2="174" stroke="#818cf8" stroke-width="1" />
    <line x1="976" y1="174" x2="1104" y2="46" stroke="#818cf8" stroke-width="1" />
  </g>

  <!-- Flowing Dynamic Light Wave across Lower Half (Behind pills) -->
  <path class="wave-line" d="M -50 310 Q 250 250 550 320 T 1250 290" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35" />
  <path class="wave-line" d="M -50 330 Q 300 380 650 310 T 1250 330" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.25" />

  <!-- Animated Sparkle Particles -->
  <circle class="particle-1" cx="240" cy="60" r="3" fill="#38bdf8" />
  <circle class="particle-2" cx="890" cy="75" r="3.5" fill="#f472b6" />
  <circle class="particle-3" cx="1120" cy="240" r="2.5" fill="#a855f7" />
  <circle class="particle-1" cx="120" cy="270" r="2.5" fill="#818cf8" />
  <circle class="particle-2" cx="620" cy="50" r="3" fill="#38bdf8" />

  <!-- FOREGROUND CONTENT: Header Tag Pill -->
  <g transform="translate(80, 52)">
    <rect width="310" height="34" rx="17" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="6" fill="#10b981" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e0e7ff" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <text x="80" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">Awesome AI Video Generation</text>

  <!-- FOREGROUND CONTENT: Subtitle & Tagline -->
  <text x="80" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#f8fafc" letter-spacing="0.2">Top Foundation Models, Self-Hosted Video Diffusion &amp; Generative SaaS Platforms</text>
  <text x="80" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.1">Curated list covering OpenAI Sora, Runway Gen-4, Kling AI, LTX-Video, CogVideoX, Wan2.2 &amp; Open-Sora</text>

  <!-- FOREGROUND CONTENT: Feature Filter Pills / Badges (Y: 280) -->
  <!-- Pill 1: Text-to-Video -->
  <g transform="translate(80, 276)">
    <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="22" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e0f2fe">🎬 Text-to-Video</text>
  </g>

  <!-- Pill 2: Image-to-Video -->
  <g transform="translate(275, 276)">
    <rect width="185" height="42" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="22" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e0e7ff">🖼️ Image-to-Video</text>
  </g>

  <!-- Pill 3: Open Weights & DiT -->
  <g transform="translate(475, 276)">
    <rect width="215" height="42" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="22" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f3e8ff">⚡ Open-Weight DiT / MoE</text>
  </g>

  <!-- Pill 4: Self-Hosted Diffusion -->
  <g transform="translate(705, 276)">
    <rect width="205" height="42" rx="10" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="22" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fce7f3">🖥️ Self-Hosted Diffusion</text>
  </g>

  <!-- Pill 5: Commercial SaaS -->
  <g transform="translate(925, 276)">
    <rect width="195" height="42" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="22" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#d1fae5">💎 Commercial SaaS</text>
  </g>

  <!-- Bottom Accent Status Line -->
  <line x1="80" y1="365" x2="1120" y2="365" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="80" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">⭐ Community Driven • Regularly Updated • Open Source &amp; Enterprise Solutions</text>
  <text x="960" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#a855f7">Updated October 2026</text>
</svg>
